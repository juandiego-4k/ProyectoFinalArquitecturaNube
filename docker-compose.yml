version: '3.9'

services:
  # ── Production (built image served via nginx) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    image: cloudcommerce-frontend:latest
    container_name: cloudcommerce-frontend
    ports:
      - "80:80"
    depends_on:
      products-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      checkout-service:
        condition: service_healthy
    restart: unless-stopped

  # ── Development (Vite dev server with hot reload) ──────────────────────────
  frontend-dev:
    image: node:20-alpine
    container_name: cloudcommerce-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    profiles:
      - dev

  # ── Backend microservices ──────────────────────────────────────────────────
  products-service:
    build: ./backend/products-service
    image: cloudcommerce-products-service:latest
    container_name: cloudcommerce-products-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => { if (r.statusCode === 200) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  cart-service:
    build: ./backend/cart-service
    image: cloudcommerce-cart-service:latest
    container_name: cloudcommerce-cart-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => { if (r.statusCode === 200) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  checkout-service:
    build: ./backend/checkout-service
    image: cloudcommerce-checkout-service:latest
    container_name: cloudcommerce-checkout-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/health', (r) => { if (r.statusCode === 200) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  frontend_node_modules:
