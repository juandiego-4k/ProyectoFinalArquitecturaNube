version: '3.9'

services:
  # ── Production (built image served via nginx) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    image: cloudcommerce-frontend:latest
    container_name: cloudcommerce-frontend
    ports:
      - "80:80"
    restart: unless-stopped

  # ── Development (Vite dev server with hot reload) ──────────────────────────
  frontend-dev:
    image: node:20-alpine
    container_name: cloudcommerce-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    profiles:
      - dev

volumes:
  frontend_node_modules:
