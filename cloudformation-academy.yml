AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudCommerce - AWS Academy Compatible (EC2 Launch Type)'

Parameters:
  EnvironmentName:
    Type: String
    Default: 'cloudcommerce'
  AccountId:
    Type: String
    AllowedPattern: '^\d{12}$'
  Region:
    Type: String
    Default: 'us-east-1'

Resources:
  CloudCommerceVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CloudCommerceVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CloudCommerceVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref CloudCommerceVPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref CloudCommerceVPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetAssoc1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  SubnetAssoc2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Security group for ALB'
      VpcId: !Ref CloudCommerceVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ECSTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Security group for ECS'
      VpcId: !Ref CloudCommerceVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 0
          ToPort: 65535
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  ECSLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${EnvironmentName}'
      RetentionInDays: 7

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${EnvironmentName}-cluster'

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${EnvironmentName}-alb'
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-tg-frontend'
      Port: 80
      Protocol: HTTP
      VpcId: !Ref CloudCommerceVPC
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2

  ProductsTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-tg-products'
      Port: 3001
      Protocol: HTTP
      VpcId: !Ref CloudCommerceVPC
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2

  CartTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-tg-cart'
      Port: 3002
      Protocol: HTTP
      VpcId: !Ref CloudCommerceVPC
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2

  CheckoutTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-tg-checkout'
      Port: 3003
      Protocol: HTTP
      VpcId: !Ref CloudCommerceVPC
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup

  APIProductsRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          Values:
            - '/api/products*'
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ProductsTargetGroup

  APICartRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 2
      Conditions:
        - Field: path-pattern
          Values:
            - '/api/cart*'
      Actions:
        - Type: forward
          TargetGroupArn: !Ref CartTargetGroup

  APICheckoutRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 3
      Conditions:
        - Field: path-pattern
          Values:
            - '/api/checkout*'
            - '/api/orders*'
      Actions:
        - Type: forward
          TargetGroupArn: !Ref CheckoutTargetGroup

  FrontendTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentName}-frontend'
      ContainerDefinitions:
        - Name: frontend
          Image: !Sub '${AccountId}.dkr.ecr.${Region}.amazonaws.com/cloudcommerce/frontend:latest'
          Memory: 256
          PortMappings:
            - ContainerPort: 80
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ECSLogGroup
              awslogs-region: !Ref Region
              awslogs-stream-prefix: frontend

  ProductsTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentName}-products'
      ContainerDefinitions:
        - Name: products-service
          Image: !Sub '${AccountId}.dkr.ecr.${Region}.amazonaws.com/cloudcommerce/products-service:latest'
          Memory: 256
          PortMappings:
            - ContainerPort: 3001
          Environment:
            - Name: PORT
              Value: '3001'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ECSLogGroup
              awslogs-region: !Ref Region
              awslogs-stream-prefix: products

  CartTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentName}-cart'
      ContainerDefinitions:
        - Name: cart-service
          Image: !Sub '${AccountId}.dkr.ecr.${Region}.amazonaws.com/cloudcommerce/cart-service:latest'
          Memory: 256
          PortMappings:
            - ContainerPort: 3002
          Environment:
            - Name: PORT
              Value: '3002'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ECSLogGroup
              awslogs-region: !Ref Region
              awslogs-stream-prefix: cart

  CheckoutTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentName}-checkout'
      ContainerDefinitions:
        - Name: checkout-service
          Image: !Sub '${AccountId}.dkr.ecr.${Region}.amazonaws.com/cloudcommerce/checkout-service:latest'
          Memory: 256
          PortMappings:
            - ContainerPort: 3003
          Environment:
            - Name: PORT
              Value: '3003'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ECSLogGroup
              awslogs-region: !Ref Region
              awslogs-stream-prefix: checkout

  FrontendService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: !Sub '${EnvironmentName}-frontend'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref FrontendTaskDef
      DesiredCount: 1
      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: 80
          TargetGroupArn: !Ref FrontendTargetGroup

  ProductsService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: !Sub '${EnvironmentName}-products'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref ProductsTaskDef
      DesiredCount: 1
      LoadBalancers:
        - ContainerName: products-service
          ContainerPort: 3001
          TargetGroupArn: !Ref ProductsTargetGroup

  CartService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: !Sub '${EnvironmentName}-cart'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref CartTaskDef
      DesiredCount: 1
      LoadBalancers:
        - ContainerName: cart-service
          ContainerPort: 3002
          TargetGroupArn: !Ref CartTargetGroup

  CheckoutService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: !Sub '${EnvironmentName}-checkout'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref CheckoutTaskDef
      DesiredCount: 1
      LoadBalancers:
        - ContainerName: checkout-service
          ContainerPort: 3003
          TargetGroupArn: !Ref CheckoutTargetGroup

Outputs:
  LoadBalancerDNS:
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  ApplicationURL:
    Value: !Sub 'http://${ApplicationLoadBalancer.DNSName}'
  ClusterName:
    Value: !Ref ECSCluster
